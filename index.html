<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benson Aneesh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .wrapper {
            text-align: center;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
        }

        .name-container {
            font-size: clamp(1.8rem, 5vw, 3.5rem); /* Dynamically scales with screen size */
            font-weight: 200;
            letter-spacing: 0.4rem;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .first-name {
            color: #888888;
        }

        .last-name {
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 0.45rem;
        }

        .divider {
            width: 40px;
            height: 1px;
            background-color: #444444;
            margin: 2rem auto;
        }

        .status {
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            font-weight: 300;
            letter-spacing: 0.2rem;
            color: #666666;
            text-transform: uppercase;
            animation: breathe 3s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1 class="name-container">
            <span class="first-name">benson</span> <span class="last-name">aneesh</span>
        </h1>
        <div class="divider"></div>
        <p class="status">Coming Soon</p>
    </div>

</body>
</html>
